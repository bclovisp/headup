<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Head Up</title>
<meta name="theme-color" content="#E8F0E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Head Up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F0E1; --ink:#15301F; --muted:#4A6553; --card:#FFFFFF; --line:#CFDCC8;
  --gold:#FFD23F; --good:#1C8A41; --bad:#CF3A26; --btn:#15301F; --btn-ink:#FFFFFF; --soft:#F3F7EF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F;
    --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --soft:#11241A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C14; --ink:#E4EFDF; --muted:#9AB3A2; --card:#15291D; --line:#26432F;
  --good:#5FD782; --bad:#FF7B67; --btn:#FFD23F; --btn-ink:#15301F; --soft:#11241A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
.app{max-width:520px;margin:0 auto;padding:10px 14px 32px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{flex:1;text-align:left;font-weight:700;font-size:1.15rem;background:none;border:0;padding:6px 0;cursor:pointer}
.stars{font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 13px;min-height:38px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* home */
.chapter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;margin:0 0 14px}
.chapter h2{margin:0;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.chapter .rule{margin:4px 0 10px;color:var(--muted);font-size:.98rem}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:10px 12px;margin:0 0 8px;min-height:52px;cursor:pointer}
.lesson .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink);color:var(--bg);font-size:.9rem}
.lesson .name{flex:1;font-weight:700}
.lesson .st{font-size:1.15rem}
.lesson.current{border-color:var(--gold);background:var(--card)}
.lesson.current .num{background:var(--gold);color:#15301F}
.lesson.done .num{background:var(--good);color:#fff}
.lesson:disabled{cursor:default;opacity:.55}
.parents{margin-top:20px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.parents p{margin:0 0 8px;font-weight:700}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:36px}
.parents .linkbtn{display:block}

/* intro + finish */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.card .big{font-size:3.2rem;line-height:1;margin:0 0 8px}
.card h2{margin:0 0 6px;font-size:1.45rem}
.card .sub{margin:0 0 12px;color:var(--muted);font-weight:700}
.card .text{margin:0 0 16px;text-align:left}
.rulebox{border-left:5px solid var(--gold);background:var(--soft);padding:10px 12px;margin:0 0 16px;text-align:left;font-weight:700;border-radius:0 10px 10px 0}
.talkbox{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 16px;text-align:left}
.card .btn{margin-top:4px}

/* play */
.playbar{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.ltitle{flex:1;font-weight:700;color:var(--muted);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:flex;gap:6px}
.streak i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.streak i.on{background:var(--gold);border-color:#D9A800}
.question{font-size:1.28rem;line-height:1.3;margin:4px 2px 10px;font-weight:700}
.pitch-wrap{position:relative;border-radius:16px;overflow:hidden;border:3px solid #2A7A46;background:#3A9A5B}
#pitch{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.flash{position:absolute;inset:auto 0 0 0;padding:0;background:transparent}
.flash span{display:none}
.hint.bold{font-weight:700;color:var(--ink)}
.flash i{display:block;height:6px;margin:0;border-radius:0;background:var(--gold);transform-origin:left;animation:shrink 2.6s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.legend{display:flex;justify-content:center;gap:18px;margin:8px 0 10px;color:var(--muted);font-size:.95rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.08rem;cursor:pointer}
.choice .let{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#15301F;color:#FFD23F}
.choice:disabled{cursor:default}
.choice.picked{border-color:var(--ink)}
.choice.right{border-color:var(--good);background:color-mix(in srgb, var(--good) 12%, var(--card))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 10%, var(--card))}
.choice .mark{margin-left:auto}
.hint{text-align:center;color:var(--muted);margin:10px 0 0;font-size:1rem;min-height:1.45em}
.hint.good{color:var(--good);font-weight:700}
.hint.bad{color:var(--bad);font-weight:700}
.count{text-align:center;margin:4px 0 0;font-weight:700}
.panel{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px}
.verdict{font-size:1.4rem;font-weight:700;margin:0 0 6px}
.verdict.good{color:var(--good)}
.verdict.bad,.verdict.meh{color:var(--bad)}
.detail{margin:0 0 14px;font-size:1.08rem}
.streakmsg{margin:-4px 0 14px;color:var(--muted);font-weight:700}
.btn{display:block;font-weight:700;font-size:1.1rem;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin-top:10px}
.btn.gold{background:#FFD23F;color:#15301F}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

/* pitch layers */
.zone{cursor:pointer}
.ring{fill:rgba(255,255,255,.16);stroke:#fff;stroke-width:2.5;stroke-dasharray:5 4;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{fill:rgba(255,255,255,.32)}}
.zone.dim{opacity:.35}
.zone.chosen .ring{animation:none;stroke-dasharray:none;fill:rgba(255,255,255,.25)}
.zone.best .ring{animation:none;stroke-dasharray:none;stroke:#FFE45C;stroke-width:3.5;fill:rgba(255,228,92,.28)}
.reveal{opacity:0;transition:opacity .6s ease}
.reveal.on{opacity:1}
.d1{transition-delay:.15s}.d2{transition-delay:.45s}
.instant .reveal{transition:none}
.shadow{transition:opacity .3s ease}
.shadow.off{opacity:0}
.fadeable{transition:opacity .5s ease}
.hidden-ent{opacity:0}
body[data-state="result"] .hit{cursor:pointer}
body[data-state="explore"] .hit{pointer-events:none}
body[data-state="explore"] #pitch{cursor:crosshair}
@media (prefers-reduced-motion: reduce){ .ring{animation:none} .reveal,.shadow,.fadeable{transition:none} .flash i{animation-duration:.01s} }

</style>
</head>
<body data-screen="home" data-state="">
<div class="app">

    <button type="button" class="brand" id="brand"></button>

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </header>

  <section id="home" class="screen"></section>
  <section id="intro" class="screen" hidden></section>

  <section id="play" class="screen" hidden>
    <div class="playbar">
      <button type="button" class="linkbtn" id="back"></button>
      <span class="ltitle" id="ltitle"></span>
      <span class="streak" id="streak" aria-live="polite"></span>
    </div>
    <h1 class="question" id="question"></h1>
    <div class="pitch-wrap">
      <svg id="pitch" viewBox="0 258 370 296" role="img" aria-labelledby="question"></svg>
      <div class="flash" id="flash" hidden><span id="flashText"></span><i id="flashBar"></i></div>
    </div>
    <p class="legend"><span><i style="background:#000"></i><b id="lgUs"></b></span><span><i style="background:#E53935"></i><b id="lgThem"></b></span></p>
    <div class="choices" id="choices"></div>
    <p class="hint" id="hint"></p>
    <p class="count" id="count" hidden></p>
    <button type="button" class="btn ghost" id="done" hidden></button>
    <section class="panel" id="panel" hidden aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <p class="detail" id="detail"></p>
      <p class="streakmsg" id="streakmsg" hidden></p>
      <button type="button" class="btn ghost" id="showme" hidden></button>
      <button type="button" class="btn gold" id="bonus" hidden></button>
      <button type="button" class="btn" id="next"></button>
    </section>
  </section>

  <section id="finish" class="screen" hidden></section>
</div>

/* ===== Head Up core: geometry + deterministic simulation (no DOM) ===== */
var W = 370, R_BODY = 11, R_REACH = 20, R_GK = 13, R_ZONE = 24;
var MAX_PASS = 180, MIN_FROM_BALL = 35, MARK_DIST = 32;

function dist(a,b){ return Math.hypot(b[0]-a[0], b[1]-a[1]); }
function angDiff(a,b){ var d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return Math.abs(d); }
function lerp(a,b,k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; }
function backOff(from,to,by){ var d=dist(from,to)||1; return [to[0]-(to[0]-from[0])/d*by, to[1]-(to[1]-from[1])/d*by]; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* Build a playable instance from lesson + variant index, optionally mirrored left/right. */
function instantiate(lesson, vi, mirror){
  var v = clone(lesson.vars[vi]);
  function mx(p){ return (mirror && Array.isArray(p) && typeof p[0]==="number") ? [W-p[0], p[1]].concat(p.slice(2)) : p; }
  var inst = {
    id: lesson.id, vi: vi, mirror: !!mirror, y0: v.v, ov: lesson.ov || {}, flash: !!lesson.flash, bonus: !!lesson.bonus,
    m: {p: mx(v.m).slice(0,2), k: !!v.m[2]},
    us: (v.us||[]).map(function(p){ p=mx(p); return {p:[p[0],p[1]], k:!!p[2]}; }),
    them: (v.them||[]).map(function(p){ p=mx(p); return {p:[p[0],p[1]], k:!!p[2]}; }),
    holder: v.h,
    keys: lesson.opts.slice(), ok: lesson.ok, options: {}
  };
  lesson.opts.forEach(function(k){
    var o = v.o[k];
    inst.options[k] = {
      at: mx(o.at),
      nl: !!o.nl,
      steps: o.s.map(function(st){ return st.map(function(x){ return mx(x); }); })
    };
  });
  return inst;
}

/* ----- state helpers ----- */
function teamOf(ref){ return (ref==="m" || ref[0]==="u") ? "us" : "them"; }
function ent(st, ref){ if(ref==="m") return st.m; var i=+ref.slice(1); return ref[0]==="u" ? st.us[i] : st.them[i]; }
function reach(e){ return e.k ? R_GK : R_REACH; }
function ballOff(ref){ return teamOf(ref)==="us" ? [0,-10] : [0,10]; }
function ballAt(st, ref){ var e=ent(st,ref), o=ballOff(ref); return [e.p[0]+o[0], e.p[1]+o[1]]; }
function allRefs(st, team){
  var r=[];
  if(team==="us"){ st.us.forEach(function(_,i){ r.push("u"+i); }); r.push("m"); }
  else st.them.forEach(function(_,i){ r.push("t"+i); });
  return r;
}
function initState(inst){
  var st = { m: clone(inst.m), us: clone(inst.us), them: clone(inst.them), holder: inst.holder };
  st.ball = ballAt(st, st.holder);
  return st;
}

/* Nearest blocker of a straight ball path from `from` to `to`, among the refs given. */
function blockerOn(st, from, to, refs, skip){
  var aT=Math.atan2(to[1]-from[1], to[0]-from[0]), dT=dist(from,to), best=null;
  refs.forEach(function(ref){
    if(skip && skip.indexOf(ref)>=0) return;
    var e=ent(st,ref), dO=dist(from,e.p);
    if(dO>=dT || dO<1) return;
    var aO=Math.atan2(e.p[1]-from[1], e.p[0]-from[0]);
    if(angDiff(aT,aO) < Math.asin(Math.min(1, reach(e)/dO))){
      if(!best || dO<best.d){
        var ux=(to[0]-from[0])/dT, uy=(to[1]-from[1])/dT, t=(e.p[0]-from[0])*ux+(e.p[1]-from[1])*uy;
        best={ref:ref, d:dO, point:[from[0]+ux*Math.max(t,0), from[1]+uy*Math.max(t,0)]};
      }
    }
  });
  return best;
}
function opp(team){ return team==="us" ? "them" : "us"; }

/* Shadow polygon (tangent cone behind an entity, seen from the ball). */
function shadowPoly(ball, e){
  var p=e.p, r=reach(e), dx=p[0]-ball[0], dy=p[1]-ball[1], d=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
  if(d<=r+1) return null;
  var th=Math.asin(r/d), L=Math.sqrt(d*d-r*r), F=1200;
  function q(len,ang){ return [ball[0]+len*Math.cos(ang), ball[1]+len*Math.sin(ang)]; }
  return [q(L,a-th), q(F,a-th), q(F,a+th), q(L,a+th)];
}

/* ----- simulation: returns {result, events, state} ----- */
function simulate(inst, key){
  var st = initState(inst), ev = [], result = null;
  var steps = inst.options[key].steps;
  function setHolder(ref){ st.holder=ref; st.ball = ref ? ballAt(st,ref) : st.ball; }
  steps.forEach(function(s){
    var op=s[0];
    if(op==="run" || op==="escape"){
      var who=s[1], e=ent(st,who), from=e.p.slice(), to=s[2].slice(0,2), wb = st.holder===who;
      ev.push({t:"move", ref:who, from:from, to:to, withBall:wb});
      e.p=to; if(wb) st.ball=ballAt(st,who);
      if(op==="escape"){ ev.push({t:"ring", ref:who, cls:"bad"}); result="bad"; }
    }
    else if(op==="pass"){
      var from=s[1], team=teamOf(from), start=st.ball.slice(), recv = typeof s[2]==="string" ? s[2] : null;
      var target = recv ? ent(st,recv).p.slice() : s[2].slice(0,2), lofted = s[3] && s[3].lofted;
      var blk = lofted ? null : blockerOn(st, start, target, allRefs(st, opp(team)));
      if(blk){
        var end=backOff(start, ent(st,blk.ref).p, R_BODY+3);
        ev.push({t:"ball", from:start, to:end});
        ev.push({t:"ring", ref:blk.ref, cls: team==="us"?"bad":"good"});
        setHolder(blk.ref); result = team==="us" ? "bad" : "good";
      } else if(recv){
        var end2 = ballAt(st, recv);
        ev.push({t:"ball", from:start, to:end2});
        setHolder(recv);
        if(recv==="m" || team==="them") ev.push({t:"ring", ref:recv, cls: team==="us"?"good":"bad"});
        result = team==="us" ? "good" : "bad";
      } else {
        ev.push({t:"ball", from:start, to:target});
        st.holder=null; st.ball=target.slice();
      }
    }
    else if(op==="shot"){
      var sh=s[1], team2=teamOf(sh), gy = team2==="us" ? 6 : 544, start2=st.ball.slice();
      var refs=allRefs(st, opp(team2)), gk=null;
      refs.forEach(function(r){ if(ent(st,r).k) gk=ent(st,r); });
      var order = (gk && gk.p[0] < 185) ? [[200,gy],[170,gy],[185,gy]] : [[170,gy],[200,gy],[185,gy]];
      var scored=null, firstBlk=null;
      for(var i=0;i<order.length;i++){
        var b=blockerOn(st, start2, order[i], refs);
        if(!b){ scored=order[i]; break; }
        if(!firstBlk) firstBlk=b;
      }
      if(scored){
        ev.push({t:"ball", from:start2, to:scored, fast:true}); ev.push({t:"goal", at:scored, cls: team2==="us"?"good":"bad"});
        st.holder=null; st.ball=scored.slice(); result = team2==="us" ? "good" : "bad";
      } else {
        var end3=backOff(start2, ent(st,firstBlk.ref).p, R_BODY+3);
        ev.push({t:"ball", from:start2, to:end3, fast:true}); ev.push({t:"ring", ref:firstBlk.ref, cls: team2==="us"?"bad":"good"});
        setHolder(firstBlk.ref); result = team2==="us" ? "bad" : "good";
      }
    }
    else if(op==="take" || op==="win"){
      var taker = op==="win" ? "m" : s[1], te=ent(st,taker), from4=te.p.slice();
      var to4 = backOff(from4, st.ball, R_BODY-2);
      if(dist(from4, st.ball) > R_BODY+2) ev.push({t:"move", ref:taker, from:from4, to:to4, withBall:false});
      te.p = to4;
      var oldBall = st.ball.slice();
      setHolder(taker);
      ev.push({t:"ball", from: oldBall, to: st.ball.slice(), quick:true});
      ev.push({t:"ring", ref:taker, cls: op==="win"?"good":"bad"});
      result = op==="win" ? "good" : "bad";
    }
    else if(op==="good" || op==="bad"){ ev.push({t:"ring", ref:"m", cls:op}); result=op; }
    else if(op==="meh"){ result="meh"; }
  });
  return {result:result, events:ev, state:st};
}

if(typeof module!=="undefined") module.exports = {instantiate:instantiate, simulate:simulate, blockerOn:blockerOn, initState:initState, allRefs:allRefs, ent:ent, dist:dist};
